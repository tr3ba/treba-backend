name: Deploy Backend to EC2

on:
  workflow_run:
    workflows:
      - Docker Build and Push to ECR
    types:
      - completed
  workflow_dispatch:
    inputs:
      image_revision:
        description: Existing reviewed image commit SHA (empty uses the selected ref)
        required: false
        type: string

env:
  AWS_REGION: eu-west-1
  EC2_INSTANCE_ID: i-0d469acaa36d8d39d
  ECR_REGISTRY: 019066823315.dkr.ecr.eu-west-1.amazonaws.com
  ECR_REPOSITORY: treba-backend

concurrency:
  group: treba-backend-ec2
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout the image revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy backend through AWS SSM
        shell: bash
        env:
          DEPLOY_REVISION: ${{ github.event.inputs.image_revision || github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          revision = os.environ['DEPLOY_REVISION']
          if not re.fullmatch('[0-9a-f]{40}', revision):
              raise SystemExit('Invalid image revision')
          image = os.environ['ECR_REGISTRY'] + '/' + os.environ['ECR_REPOSITORY'] + ':' + revision
          script = Path('scripts/server/deploy-telegram-backend.sh').read_text()
          command = "bash -s -- '" + image + "' '" + revision + "' <<'TREBA_DEPLOYMENT'\n" + script + '\nTREBA_DEPLOYMENT'
          Path('ssm-deploy.json').write_text(json.dumps({'commands': [command], 'executionTimeout': ['900']}))
          PY
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Treba backend from ECR" \
            --parameters file://ssm-deploy.json \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          for attempt in $(seq 1 90); do
            status=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in Success|Failed|Cancelled|TimedOut|Cancelling) break ;; esac
            sleep 10
          done
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' --output json > deployment-report.json
          cat deployment-report.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          if json.loads(Path('deployment-report.json').read_text())['Status'] != 'Success':
              raise SystemExit('Backend deployment failed; check the rollback result in the SSM report.')
          PY
