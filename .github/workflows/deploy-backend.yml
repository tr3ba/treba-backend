name: Deploy Backend to EC2

on:
  workflow_run:
    workflows:
      - Docker Build and Push to ECR
    types:
      - completed
  workflow_dispatch:

env:
  AWS_REGION: eu-west-1
  EC2_INSTANCE_ID: i-0d469acaa36d8d39d
  ECR_REGISTRY: 019066823315.dkr.ecr.eu-west-1.amazonaws.com
  ECR_REPOSITORY: treba-backend

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy backend through AWS SSM
        shell: bash
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Treba backend from ECR" \
            --parameters 'commands=[
              "set -e",
              "aws ecr get-login-password --region eu-west-1 | docker login --username AWS --password-stdin 019066823315.dkr.ecr.eu-west-1.amazonaws.com",
              "docker pull 019066823315.dkr.ecr.eu-west-1.amazonaws.com/treba-backend:latest",
              "docker stop treba-backend || true",
              "docker rm treba-backend || true",
              "docker run -d --name treba-backend --restart unless-stopped --env-file /home/ubuntu/treba-backend.env -p 5000:5000 019066823315.dkr.ecr.eu-west-1.amazonaws.com/treba-backend:latest",
              "sleep 5",
              "curl -fsS http://localhost:5000/WeatherForecast >/dev/null",
              "docker ps --filter name=treba-backend"
            ]' \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}'
