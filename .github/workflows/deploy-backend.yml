name: Deploy Backend to EC2

on:
  workflow_run:
    workflows:
      - Docker Build and Push to ECR
    types:
      - completed
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            aws ecr get-login-password --region eu-west-1 | docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}
            docker pull ${{ secrets.ECR_REGISTRY }}/treba-backend:latest
            docker stop treba-backend || true
            docker rm treba-backend || true
            docker run -d --name treba-backend --restart unless-stopped --env-file /home/ubuntu/treba-backend.env -p 5000:5000 ${{ secrets.ECR_REGISTRY }}/treba-backend:latest
            docker ps
