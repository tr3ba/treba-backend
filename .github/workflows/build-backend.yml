name: Backend Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: treba_tests
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: treba_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d treba_tests"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore all projects
        run: >-
          dotnet restore src/Rozetka-clone/Rozetka-clone.sln
          -p:NuGetAudit=true
          -p:NuGetAuditMode=all
          -p:NuGetAuditLevel=high
          -warnaserror:NU1900,NU1903,NU1904,NU1905

      - name: Build all projects
        run: dotnet build src/Rozetka-clone/Rozetka-clone.sln --configuration Release --no-restore

      - name: Check NuGet packages for vulnerabilities
        run: dotnet list src/Rozetka-clone/Rozetka-clone.sln package --vulnerable --include-transitive

      - name: Run tests
        env:
          TREBA_TEST_POSTGRES: Host=127.0.0.1;Port=5432;Database=treba_tests;Username=postgres;Password=treba_ci_only
        run: dotnet test src/Rozetka-clone/WebApi.Tests/WebApi.Tests.csproj --configuration Release --no-build
