name: Docker Build and Push to ECR

on:
  push:
    branches:
      - main
    paths:
      - src/**
      - tests/**
      - docker/Dockerfile.backend
      - .dockerignore
      - .github/workflows/docker-publish.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: eu-west-1
  ECR_REPOSITORY: treba-backend

jobs:
  docker:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: treba_tests
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: treba_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d treba_tests"
          --health-interval 5s --health-timeout 5s --health-retries 12

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test the image source against PostgreSQL before publishing
        env:
          TREBA_TEST_POSTGRES: Host=127.0.0.1;Port=5432;Database=treba_tests;Username=postgres;Password=treba_ci_only
        run: dotnet test tests/WebApi.Tests/WebApi.Tests.csproj -c Release

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, smoke test and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -f docker/Dockerfile.backend \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            .

          # Temporary values used only by this test container.
          # Do not print them or reuse them in production.
          JWT_TEST_KEY="$(openssl rand -hex 32)"
          ENC_TEST_KEY="$(openssl rand -base64 32)"
          OTP_TEST_KEY="$(openssl rand -base64 32)"

          docker run -d --name treba-backend-test \
            -p 5050:5000 \
            -e ConnectionStrings__DefaultConnection="Host=localhost;Port=5432;Database=test;Username=test;Password=test" \
            -e Jwt__SecretKey="$JWT_TEST_KEY" \
            -e Security__EncryptionKey="$ENC_TEST_KEY" \
            -e Security__OtpHashKey="$OTP_TEST_KEY" \
            "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          trap 'docker rm -f treba-backend-test treba-admin-test >/dev/null 2>&1 || true' EXIT

          echo "Waiting for backend /ping..."
          ready=false

          for attempt in $(seq 1 15); do
            if curl -fsS http://localhost:5050/ping >/dev/null 2>&1; then
              ready=true
              break
            fi

            if [ "$(docker inspect -f '{{.State.Running}}' treba-backend-test)" != "true" ]; then
              echo "Test container stopped before /ping became available."
              docker ps -a --filter name=treba-backend-test
              exit 1
            fi

            sleep 2
          done

          if [ "$ready" != "true" ]; then
            echo "Backend /ping did not become available."
            docker ps -a --filter name=treba-backend-test
            exit 1
          fi

          echo "Backend /ping passed."
          curl -fsS http://localhost:5050/telegram/ | grep 'app-shell' >/dev/null
          curl -fsS http://localhost:5050/telegram/app.js | grep 'Telegram' >/dev/null
          curl -fsS http://localhost:5050/telegram/ui.js >/dev/null
          curl -fsS http://localhost:5050/telegram/mini.css >/dev/null
          curl -fsS http://localhost:5050/telegram/brand-mark.png >/dev/null
          curl -fsS http://localhost:5050/api/telegram/configuration >/dev/null
          echo "Published Telegram HTML, assets and configuration route passed."

          docker run -d --name treba-admin-test -p 5051:5100 \
            -e ASPNETCORE_URLS=http://+:5100 -e WebsiteLogin__Enabled=true \
            -e WebsiteLogin__StoreOrigin=https://treba.duckdns.org \
            -e WebsiteLogin__AdminOrigin=https://admin.treba.duckdns.org \
            --entrypoint dotnet "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            /app/admin/AdminPanel.dll --contentRoot=/app/admin
          admin_ready=false
          for attempt in $(seq 1 20); do
            if curl -fsS http://localhost:5051/health >/dev/null 2>&1; then admin_ready=true; break; fi
            sleep 1
          done
          [ "$admin_ready" = true ] || { echo 'Published AdminPanel did not start.'; exit 1; }
          curl -fsS http://localhost:5051/ | grep 'blazor.web.js' >/dev/null
          curl -fsS http://localhost:5051/js/site-login.js | grep 'trebaSiteLogin' >/dev/null
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:5051/site-login/start)" = 302 ]
          echo 'Published AdminPanel HTML, assets and website entry passed.'

          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          if [ "$GITHUB_REF" = refs/heads/main ]; then
            docker tag "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" "$ECR_REGISTRY/$ECR_REPOSITORY:latest"
            docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"
          fi
