services:
  db:
    image: postgres:18-alpine
    container_name: treba-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-treba_local_dev}
      POSTGRES_DB: ${POSTGRES_DB:-treba_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - treba-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-treba_dev}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./treba-backend
      dockerfile: docker/Dockerfile.backend
    container_name: treba-backend
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5000
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=${POSTGRES_DB:-treba_dev};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-treba_local_dev}"
      JWT__Secret: ${JWT_SECRET:-local-development-secret-change-me}
      JWT__Issuer: ${JWT_ISSUER:-treba-dev}
      JWT__Audience: ${JWT_AUDIENCE:-treba-client}
      JWT__ExpirationMinutes: ${JWT_EXPIRATION_MINUTES:-60}
      OAuth__Google__ClientId: ${GOOGLE_CLIENT_ID:-}
      OAuth__Google__ClientSecret: ${GOOGLE_CLIENT_SECRET:-}
      Payment__WayForPay__MerchantId: ${WAYFORPAY_MERCHANT_ID:-}
      Payment__WayForPay__ApiKey: ${WAYFORPAY_API_KEY:-}
      Email__Smtp__Host: ${SMTP_HOST:-}
      Email__Smtp__Port: ${SMTP_PORT:-587}
      Email__Smtp__Username: ${SMTP_USERNAME:-}
      Email__Smtp__Password: ${SMTP_PASSWORD:-}
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - treba-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/WeatherForecast"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./treba-frontend
      dockerfile: docker/Dockerfile.frontend
    container_name: treba-frontend
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5000}
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Treba Marketplace}
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - treba-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  treba-network:
    driver: bridge
