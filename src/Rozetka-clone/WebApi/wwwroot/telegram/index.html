<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="referrer" content="no-referrer">
  <title>Treba · Робоча панель</title>
  <link rel="icon" type="image/png" href="brand-mark.png">
  <link rel="preload" as="image" href="brand-mark.png">
  <link rel="stylesheet" href="mini.css">
  <script defer src="https://telegram.org/js/telegram-web-app.js"></script>
  <script type="module" src="app.js"></script>
</head>
<body>
  <div id="startup" class="startup-screen" role="status" aria-live="polite" aria-label="Завантажується Treba">
    <div class="startup-content">
      <div class="startup-emblem" aria-hidden="true"><span class="startup-orbit"></span><span class="startup-logo"><img src="brand-mark.png" alt="" width="176" height="176"></span></div>
      <h1>TREBA</h1>
      <p class="startup-subtitle">Робоча панель</p>
      <p class="startup-caption">Усе важливе — поруч.</p>
      <div class="startup-progress" aria-hidden="true"><span></span><span></span><span></span></div>
      <span class="sr-only">Відкриваємо робочу панель…</span>
    </div>
    <span class="startup-footer">Продавцям і модераторам</span>
  </div>
  <div class="app-shell" hidden inert>
    <header id="header" class="app-header"><span class="brand-mark"><img src="brand-mark.png" alt="" width="39" height="39"></span><div><strong>TREBA</strong><small>Робоча панель</small></div></header>
    <main id="app" aria-live="polite" aria-busy="true"></main>
    <nav id="navigation" class="bottom-nav" aria-label="Основне меню"></nav>
    <div id="toast" class="toast" role="alert" hidden></div>
  </div>
  <noscript><style>#startup{display:none}</style><p class="noscript-message">Для роботи Treba увімкніть JavaScript і відкрийте застосунок із Telegram.</p></noscript>
</body>
</html>
